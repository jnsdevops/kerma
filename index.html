document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<script src=\"11d37b2f-1dbf-4cb3-b30c-5f1d6c70c767\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n  html,body{height:100%}\n  body{background:#E4E2DD;font-family:-apple-system,'SF Pro Text','SF Pro Display','Helvetica Neue',Inter,Arial,sans-serif}\n  input,button,textarea{font-family:inherit}\n  button{cursor:pointer;border:none;background:none}\n  ::-webkit-scrollbar{width:0;height:0}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}\n  @keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}\n  @keyframes layIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}\n  @keyframes savePop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}\n  @keyframes sheetUp{from{transform:translateY(101%)}to{transform:translateY(0)}}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  @keyframes wave{0%,100%{height:8px}50%{height:30px}}\n  @keyframes fillbar{from{width:0}to{width:100%}}\n  @media (max-width:520px), (max-height:750px) {\n    .kerma-outer { padding:0 !important; min-height:100vh !important; min-height:100dvh !important; }\n    .kerma-frame { width:100vw !important; height:100vh !important; height:100dvh !important; border-radius:0 !important; padding:0 !important; box-shadow:none !important; }\n    .kerma-screen { border-radius:0 !important; }\n  }\n<\/style>\n<\/helmet>\n\n<div class=\"kerma-outer\" style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(120% 120% at 50% 0%,#EEEDE8 0%,#E2E0DA 60%,#D8D6D0 100%)\">\n\n  <div class=\"kerma-frame\" style=\"position:relative;width:390px;height:844px;background:#0A0A09;border-radius:54px;padding:11px;box-shadow:0 1px 0 2px rgba(255,255,255,.06) inset,0 50px 90px -30px rgba(20,20,18,.55),0 18px 40px -20px rgba(20,20,18,.45)\">\n    <div class=\"kerma-screen\" style=\"position:relative;width:100%;height:100%;background:#F4F3EF;border-radius:44px;overflow:hidden\">\n\n      <!-- status bar -->\n      <div style=\"position:absolute;top:0;left:0;right:0;height:54px;z-index:60;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;pointer-events:none\">\n        <span style=\"font-size:15px;font-weight:600;color:#111110;letter-spacing:-.2px\">{{ liveTime }}<\/span>\n        <div style=\"position:absolute;top:13px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#0A0A09;border-radius:18px\"><\/div>\n        <div style=\"display:flex;align-items:center;gap:7px\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"5\" rx=\"1\" fill=\"#111110\"><\/rect><rect x=\"5\" y=\"4.5\" width=\"3\" height=\"7.5\" rx=\"1\" fill=\"#111110\"><\/rect><rect x=\"10\" y=\"2\" width=\"3\" height=\"10\" rx=\"1\" fill=\"#111110\"><\/rect><rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\" fill=\"#111110\" opacity=\".3\"><\/rect><\/svg>\n          <svg width=\"17\" height=\"12\" viewBox=\"0 0 17 12\" fill=\"none\"><path d=\"M8.5 11 1 3.6a10.5 10.5 0 0 1 15 0L8.5 11Z\" fill=\"#111110\"><\/path><\/svg>\n          <svg width=\"26\" height=\"13\" viewBox=\"0 0 26 13\"><rect x=\"1\" y=\"1\" width=\"21\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"#111110\" stroke-opacity=\".4\"><\/rect><rect x=\"3\" y=\"3\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"#111110\"><\/rect><rect x=\"23.5\" y=\"4\" width=\"1.6\" height=\"5\" rx=\".8\" fill=\"#111110\" fill-opacity=\".4\"><\/rect><\/svg>\n        <\/div>\n      <\/div>\n\n      <!-- \u25  <sc-if value=\"{{ showProjection }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:inline-flex;align-items:center;gap:6px;background:rgba(240,206,132,.14);border:1px solid rgba(240,206,132,.3);border-radius:10px;padding:7px 11px;margin-top:15px\"><span style=\"font-size:12.5px;font-weight:600;color:#F0CE84;letter-spacing:-.1px\">{{ projectionLabel }}<\/span><\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ showChart }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;font-weight:500;color:rgba(255,255,255,.5);margin-top:13px;letter-spacing:-.1px\">Now measured against the priciest store nearby.<\/div>\n            <\/sc-if>\n          <\/div>\n\n          <sc-if value=\"{{ showChart }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 1px 3px rgba(17,17,16,.05)\">\n            <div style=\"font-size:15px;font-weight:700;color:#111110;letter-spacing:-.3px;margin-bottom:18px\">Last 3 months<\/div>\n            <div style=\"display:flex;align-items:flex-end;gap:11px;height:140px\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\">\n                  <div style=\"font-size:11.5px;font-weight:700;color:#6E6A65\">{{ b.label }}<\/div>\n                  <div style=\"width:100%;height:{{ b.h }};background:{{ b.bg }};border-radius:7px;transition:height .5s ease\"><\/div>\n                  <div style=\"font-size:11px;font-weight:600;color:#A6A19A\">{{ b.month }}<\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n          <\/div>\n          <\/sc-if>\n\n          <!-- WEEKLY BUDGET -->\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 11px\">\n            <span              <svg width=\"84\" height=\"84\" viewBox=\"0 0 84 84\" style=\"transform:rotate(-90deg)\">\n                  <circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#EDEAE3\" stroke-width=\"8\"><\/circle>\n                  <circle cx=\"42\" cy=\"42\" r=\"36\" fill=\"none\" stroke=\"#0B7A53\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-dasharray=\"{{ scoreRingDash }}\" pathLength=\"100\"><\/circle>\n                <\/svg>\n                <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center\"><span style=\"font-size:23px;font-weight:700;color:#111110;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums\">{{ scoreNum }}<\/span><span style=\"font-size:10px;font-weight:600;color:#A6A19A\">{{ scoreOf }}<\/span><\/div>\n              <\/div>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:16px;font-weight:700;color:#111110;letter-spacing:-.3px;margin-bottom:11px\">{{ scoreLabel }}<\/div>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ scoreMetrics }}\" as=\"m\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;align-items:center;gap:9px\">\n                      <span style=\"flex:1;font-size:13px;font-weight:500;color:#4A463F;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ m.k }}<\/span>\n                      <span style=\"width:42px;height:5px;background:#EDEAE3;border-radius:3px;overflow:hidden;flex:none\"><span style=\"display:block;height:100%;width:{{ m.w }};background:#0B7A53;border-radius:3px\"><\/span><\/span>\n                      <span style=\"font-size:12.5px;font-weight:700;color:#0B7A53;font-variant-numeric:tabular-nums;width:38px;text-align:right\">{{ m.v }}<\/span>\n                    <\/div>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <!-- PRICE TRACKER -->\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 11px\">\n            <span style=\"font-size:15px;font-weight:700;color:#111110;letter-spacing:-.3px\">Price tracker \u00b7 OC<\/span>\n            <span style=\"font-size:12.5px;font-weight:600;color:#A6A19A\">Weekly<\/span>\n          <\/div>\n          <div style=\"background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(17,17,16,.05)\">\n            <sc-for list=\"{{ priceTracker }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid rgba(17,17,16,.055)\">\n                <span style=\"width:34px;height:34px;border-radius:10px;background:#EFEDE8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8A857D;flex:none\">{{ p.glyph }}<\/span>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14.5px;font-weight:600;color:#111110;letter-spacing:-.2px\">{{ p.name }}<\/div>\n                  <div style=\"display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:4px\">\n                    <sc-for list=\"{{ p.spark }}\" as=\"bar\" hint-placeholder-count=\"4\">\n                      <span style=\"width:5px;height:{{ bar.h }};background:{{ bar.c }};border-radius:1px\"><\/span>\n                    <\/sc-for>\n                  <\/div>\n                <\/div>\n                <div style=\"text-align:right;flex:none\">\n                  <div style=\"font-size:15px;font-weight:700;color:#111110;letter-spacing:-.2px;font-variant-numeric:tabular-nums\">{{ p.price }}<\/div>\n                  <div style=\"font-size:12px;font-weight:600;color:{{ p.chgColor }};font-variant-numeric:tabular-nums;margin-top:1px\">{{ p.chg }}<\/div>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n\n          <div style=\"font-size:15px;font-weight:700;color:#111110;letter-spacing:-.3px;margin:26px 4px 11px\">Trip history<\/div>\n          <div style=\"background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(17,17,16,.05)\">\n            <sc-for list=\"{{ trips }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:13px;padding:14px 16px;border-top:1px solid rgba(17,17,16,.055)\">\n                <div style=\"width:36px;height:36px;border-radius:11px;background:#EAF5F0;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><path d=\"M3 8.5 6.5 12 13 4.5\" stroke=\"#0B7A53\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\/path><\/svg><\/div>\n                <div style=\"flex:1\"><div style=\"font-size:15.5px;font-weight:600;color:#111110;letter-spacing:-.3px\">{{ t.store }}<\/div><div style=\"display:flex;align-items:center;gap:7px;margin-top:2px\"><span style=\"font-size:12.5px;font-weight:500;color:#A6A19A\">{{ t.date }} \u00b7 {{ t.items }}<\/span><span style=\"font-size:10px;font-weight:700;letter-spacing:.2px;color:{{ t.tagColor }};background:{{ t.tagBg }};padding:1px 6px;border-radius:5px\">{{ t.tagLabel }}<\/span><\/div><\/div>\n                <div style=\"font-size:16px;font-weight:700;color:#0B7A53;letter-spacing:-.3px\">{{ t.saved }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <\/sc-if>\n        <\/div>\n        <\/sc-if>\n\n        <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 PROFILE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n        <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:62px 20px 130px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px\">\n            <div style=\"width:78px;height:78px;border-radius:50%;background:linear-gradient(150deg,#0B7A53,#0E6A49);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;letter-spacing:-.5px;box-shadow:0 10px 26px -10px rgba(11,122,83,.6)\">{{ userInitial }}<\/div>\n            <div style=\"font-size:23px;font-weight:700;color:#111110;letter-spacing:-.5px;margin-top:13px\">{{ userDisplayName }}<\/div>\n            <div style=\"font-size:14.5px;font-weight:500;color:#A6A19A;margin-top:1px\">{{ userEmailSub }}<\/div>\n          <\/div>\n\n          <!-- LOGOUT -->\n          <button onclick=\"{{ logout }}\" style=\"width:100%;text-align:center;background:#fff;border:1px solid rgba(192,57,43,.15);border-radius:14px;padding:13px;font-size:14px;font-weight:700;color:#C0392B;margin-bottom:18px\">Log out<\/button>\n\n          <!-- HOUSEHOLD (Phase 1) -->\n          <div style=\"font-size:13px;font-weight:700;color:#A6A19A;letter-spacing:.4px;text-transform:uppercase;margin:0 4px 9px\">Household<\/div>\n          <div style=\"background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(17,17,16,.05)\">\n            <sc-if value=\"{{ hhLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13.5px;color:#A6A19A;text-align:center;padding:8px 0\">Loading household...<\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ hhNone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;font-weight:500;color:#4A463F;line-height:1.5;margin-bottom:12px\">Share your list with family. Create your household to invite members.<\/div>\n              <button onclick=\"{{ hhCreate }}\" style=\"width:100%;background:#0B7A53;color:#fff;border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;letter-spacing:-.2px\">Create household<\/button>\n            <\/sc-if>\n            <sc-if value=\"{{ hhInvited }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:14px;font-weight:600;color:#111110;margin-bottom:4px\">You're invited to {{ hhInviteName }}<\/div>\n              <div style=\"display:flex;gap:9px;margin-top:10px\">\n                <button onclick=\"{{ hhAccept }}\" style=\"flex:1;background:#0B7A53;color:#fff;border-radius:12px;padding:11px;font-size:14px;font-weight:700\">Accept<\/button>\n                <button onclick=\"{{ hhDecline }}\" style=\"flex:1;background:#EFEDE8;color:#4A463F;border-radius:12px;padding:11px;font-size:14px;font-weight:600\">Decline<\/button>\n              <\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ hhActive }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\">\n                <span style=\"font-size:15.5px;font-weight:700;color:#111110;letter-spacing:-.3px\">{{ hhName }}<\/span>\n                <sc-if value=\"{{ hhIsLead }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:700;color:#0B7A53;background:rgba(11,122,83,.1);border-radius:6px;padding:2px 7px;letter-spacing:.3px\">LEAD<\/span><\/sc-if>\n              <\/div>\n              <div style=\"font-size:12.5px;color:#A6A19A;margin-bottom:12px\">{{ hhCity }}<\/div>\n              <sc-if value=\"{{ hhIsLead }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:8px\">\n                  <input value=\"{{ hhInviteEmail }}\" oninput=\"{{ hhSetEmail }}\" placeholder=\"family@email.com\" style=\"flex:1;background:#F4F3EF;border:none;border-radius:12px;padding:11px 13px;font-size:14px;color:#111110;outline:none\" \/>\n                  <button onclick=\"{{ hhInvite }}\" style=\"background:#0B7A53;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;flex:none\">Invite<\/button>\n                <\/div>\n                <sc-if value=\"{{ hhInviteMsg }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#0B7A53;margin-top:8px;font-weight:600\">{{ hhInviteMsgText }}<\/div><\/sc-if>\n                <sc-if value=\"{{ hhHasInviteLink }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#F4F3EF;border-radius:12px;padding:11px 13px;margin-top:8px\">\n                    <div style=\"font-size:11.5px;font-family:monospace;color:#4A463F;word-break:break-all;line-height:1.4\">{{ hhInviteLink }}<\/div>\n                    <button onclick=\"{{ shareInviteLink }}\" style=\"background:#0B7A53;color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;margin-top:9px\">Share link<\/button>\n                  <\/div>\n                <\/sc-if>\n              <\/sc-if>\n            <\/sc-if>\n          <\/div>\n\n          <!-- HOW ASTRIDE LEARNS (behavioral calibration) -->\n          <div style=\"font-size:13px;font-weight:700;color:#A6A19A;letter-spacing:.4px;text-transform:uppercase;margin:0 4px 9px\">How Astride learns about you<\/div>\n          <div style=\"background:linear-gradient(160deg,#16211C,#0C1411);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 14px 30px -18px rgba(8,16,12,.6)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <span style=\"font-size:14px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:-.2px\">Your time is worth<\/span>\n              <span style=\"font-size:24px;font-weight:700;color:#F0CE84;letter-spacing:-.6px;font-variant-numeric:tabular-nums\">{{ learnTimeValue }}<\/span>\n            <\/div>\n            <div style=\"font-size:12.5px;font-weight:500;color:rgba(255,255,255,.55);margin-top:3px;letter-spacing:-.1px\">{{ learnTimeSource }}<\/div>\n            <div style=\"height:1px;background:rgba(255,255,255,.1);margin:14px 0\"><\/div>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ learnSignals }}\" as=\"g\" hint-placeholder-count ockTabLowFg }}\">To restock<\/button>\n            <button onclick=\"{{ setStockTabOk }}\" style=\"flex:1;text-align:center;padding:10px 0;border-radius:11px;font-size:13.5px;font-weight:700;background:{{ stockTabOkBg }};color:{{ stockTabOkFg }}\">Well stocked<\/button>\n          <\/div>\n          <\/sc-if>\n\n          <sc-if value=\"{{ stockTabLow }}\" hint-placeholder-val=\"{{ true }}\">\n\n          <sc-if value=\"{{ hasStockData }}\" hint-placeholder-val=\"{{ false }}\">\n          <!-- #6\/#12 TIMELINE & CONFIDENCE -->\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin:22px 4px 12px\">\n            <span style=\"font-size:13px;font-weight:700;color:#A6A19A;letter-spacing:.4px;text-transform:uppercase\">When you\u2019ll run out<\/span>\n            <span style=\"font-size:11.5px;font-weight:600;color:#A6A19A\">How sure<\/span>\n          <\/div>\n          <div style=\"background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(17,17,16,.05)\">\n            <div style=\"display:flex;justify-content:space-between;margin:0 0 12px;padding-left:46px\">\n              <span style=\"font-size:11px;font-weight:600;color:#A6A19A\">Today<\/span>\n              <span style=\"font-size:11px;font-weight:600;color:#A6A19A\">2 weeks<\/span>\n              <span style=\"font-size:11px;font-weight:600;color:#A6A19A\">2 months<\/span>\n            <\/div>\n            <div style=\"display:flex;flex-direction:column;gap:15px\">\n              <sc-for list=\"{{ pantryTimeline }}\" as=\"p\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;gap:11px\">\n                  <span style=\"font-size:20px;width:24px;text-align:center;flex:none\">{{ p.emoji }}<\/span>\n                  <div style=\"flex:1;position:relative;height:8px;border-radius:5px;background:linear-gradient(90deg,#3FA46B 0%,#E0B23C 50%,#D6553B 100%);opacity:.85\">\n                    <span style=\"position:absolute;to }\n  ];\n\n  cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }\n  gl(n){ return (n||'').trim().charAt(0).toUpperCase(); }\n\n  build(name, qty, resolved){\n    qty = qty || 1;\n    const low = name.toLowerCase().trim();\n    const key = Object.keys(this.DB).find(k => low.includes(k) || k.includes(low.split(' ')[0]));\n    if (key){\n      const db = this.DB[key];\n      const bestIdx = db.opts.findIndex(o => o.best);\n      return { id: this.nid(), name: this.cap(db.opts[0] && key === 'paper towel' ? 'Paper towels' : name), qty,\n               aisle: db.aisle, emoji: db.emoji, tint: this.TINT[db.aisle],\n               options: db.opts, chosen: resolved === false ? -1 : (bestIdx >= 0 ? bestIdx : 0) };\n    }\n    const skey = Object.keys(this.SIMPLE).find(k => low.includes(k) || k.includes(low.split(' ')[0]));\n    const meta = skey ? this.SIMPLE[skey] : { emoji:'\ud83d\uded2', aisle:'Other', tint:'#F0EEE9' };\n    return { id: this.nid(), name: this.cap(name), qty, aisle: meta.aisle, emoji: meta.emoji, tint: meta.tint, options: null, chosen: 0 };\n  }\n  _n = 100;\n  nid(){ return ++this._n; }\n\n  componentDidMount(){\n    \/\/ Everyone starts genuinely empty, including the admin account \u2014 real\n    \/\/ testing today means real data only, no seeded demo items for anyone.\n    this._captureJoin();\n    if (this.state.session) { this.loadStock(); this.loadProfile(); this.loadTrips(); this._consumeJoin(); }\n    try { window.addEventListener('popstate', this._handlePopState); } catch(e) {}\n  }\n\n  componentDidUpdate(prevProps, prevState){\n    try {\n      if (!prevState.flow && this.state.flow) {\n        this._trail('componentDidUpdate: PUSHING history, flow ' + prevState.flow + '->' + this.state.flow);\n        history.pushState({ kermaFlow: true }, '');\n      }\n      if (prevState.flow !== this.state.flow) {\n        this._trail('flow CHANGED: ' + prevState.flow + ' -> ' + this.state.flow);\n      }\n    } catch(e) {}\n  }\n\n  _handlePopState = () => {\n    this._trail('POPSTATE FIRED! current flow=' + this.state.flow);\n    if (this.state.flow) {\n      this._trail('POPSTATE clearing flow (was ' + this.state.flow + ')');\n      this.setState({ flow: null, krogerResults: [], krogerQuery: '', krogerAddedCount: 0, activeId: null });\n    }\n  };\n\n  setScroll = (el) => { this._scroll = el; };\n  toTop(){ if (this._scroll) this._scroll.scrollTop = 0; }\n  go(screen){ this.setState({ screen, flow: null }); this.toTop(); }\n\n  \/\/ add sheet\n  openAdd(method){ this.setState({ flow:'add', addMethod: method, scanState:'idle', menuState:'idle', upcState:'idle', detected:[], typeInput:'', menuText:'' }); }\n  pickMethod(m){ this.setState({ addMethod: m, scanState:'idle', menuState:'idle', upcState:'idle', detected:[] }); }\n  setTypeInput = (e) => this.setState({ typeInput: e.target.value });\n  typeKey = (e) => { if (e.key === 'Enter') this.addTyped(); };\n  addTyped = async () => {\n    const v = this.state.typeInput.trim(); if (!v) return;\n    this.setState({ typeInput:'', flow:'krogerPick', krogerLoading:true, krogerResults:[], krogerQuery:v, krogerAddedCount:0 });\n    try {\n      await this.getGeolocation();\n      const token = await this.getToken();\n      const geo = this._geo || {};\n      const params = new URLSearchParams({ q: v, limit: '6' });\n      if (geo.lat) params.set('lat', geo.lat);\n      if (geo.lng) params.set('lng', geo.lng);\n      const resp = await fetch(this._RAILWAY+'\/v1\/products\/search?'+params.toString(), { headers:{'Authorization':'Bearer '+token} });\n      if (resp.ok) {\n        const data = await resp.json();\n        const products = (data.products||[]).filter(p=>p.price);\n        this.setState({ krogerResults: products, krogerLoading:false });\n      } else {\n        this.setState({ krogerLoading:false, krogerResults:[] });\n      }\n    } catch(e) { console.warn('kerma:product-search', e); this.setState({ krogerLoading:false, krogerResults:[] }); }\n  };\n  pickKroger(idx){\n    const p = this.state.krogerResults[idx];\n    if (!p) return;\n    const item = { id:this.nid(), name:p.name, qty:1, aisle:'Grocery', emoji:'', tint:'#EFEDE8',\n      options:[{ label:p.brand||p.name, brand:(p.brand?p.brand+' \\u00b7 ':'')+(p.size||''), price:'$'+p.price.toFixed(2), store:\"Ralph's\", best:true, image:p.image }],\n      chosen:0, image:p.image };\n    this.setState(s => ({\n      items:[...s.items, item],\n      krogerResults: s.krogerResults.filter((_,i)=>i!==idx),\n      krogerAddedCount: (s.krogerAddedCount||0)+1,\n    }));\n  }\n  closeKrogerPick = () => { this.setState({ flow:null, krogerResults:[], krogerQuery:'', krogerAddedCount:0 }); };\n  loadStock = async () => {\n    try {\n      const token = await this.getToken();\n      const resp = await fetch(this._RAILWAY+'\/v1\/stock\/predict', { headers:{'Authorization':'Bearer '+token} });\n      if (resp.ok) {\n        const data = await resp.json();\n        const byName = {};\n        (data.predictions||[]).forEach(p => { byName[p.name] = p; });\n        this.setState({ stockPredictions: byName });\n      }\n    } catch(e) { console.warn('kerma:stockPredict', e); }\n  };\n  loadHousehold = async () => {\n    this.setState({ hhState:'loading' });\n    try {\n      const token = await this.getToken();\n      const resp = await fetch(this._RAILWAY+'\/v1\/household\/mine', { headers:{'Authorization':'Bearer '+token} });\n      if (resp.ok) {\n        const data = await resp.json();\n        const active = (data.memberships||[]).find(m=>m.status==='active');\n        const invited = (data.memberships||[]).find(m=>m.status==='invited');\n        if (active) { this.setState({ hhState:'active', hhData:active }); }\n        else if (invited) { this.setState({ hhState:'invited', hhData:invited }); }\n        else { this.setState({ hhState:'none', hhData:null }); }\n      } else { this.setState({ hhState:'none' }); }\n    } catch(e) { console.warn('kerma:household',e); this.setState({ hhState:'none' }); }\n  };\n  hhCreate = async () => {\n    try {\n      const token = await this.getToken();\n      const resp = await fetch(this._RAILWAY+'\/v1\/household\/create', {\n        method:'POST', headers:{'Content-Type':'application\/json','Authorization':'Bearer '+token},\n        body: JSON.stringify({ name:'My Household', city:'', zip_code:'' }) });\n      if (resp.ok || resp.status===409) this.loadHousehold();\n    } catch(e) { console.warn('kerma:hhcreate',e); }\n  };\n  hhRespond = async (accept) => {\n    const m = this.state.hhData; if (!m) return;\n    try {\n      const token = await this.getToken();\n      await fetch(this._RAILWAY+'\/v1\/household\/respond', {\n        method:'POST', headers:{'Content-Type':'application\/json','Authorization':'Bearer '+token},\n        body: JSON.stringify({ membership_id:m.id, accept }) });\n      this.loadHousehold();\n    } catch(e) { console.warn('kerma:hhrespond',e); }\n  };\n  hhInvite = async () => {\n    const email = (this.state.hhInviteEmail||'').trim(); if (!email) return;\n    const m = this.state.hhData; if (!m) return;\n    try {\n      const token = await this.getToken();\n      const resp = await fetch(this._RAILWAY+'\/v1\/household\/invite', {\n        method:'POST', headers:{'Content-Type':'application\/json','Authorization':'Bearer '+token},\n        body: JSON.stringify({ household_id:m.household_id, email }) });\n      const d = await resp.json().catch(() => ({}));\n      if (resp.ok && d.membership_id) {\n        \/\/ Kerma n'envoie aucun email : on produit un lien que l'utilisateur\n        \/\/ transmet lui-m\u00eame (WhatsApp, SMS\u2026). Le membership_id sert de jeton \u2014\n        \/\/ non devinable, et \/household\/respond v\u00e9rifie d\u00e9j\u00e0 que l'adresse du\n        \/\/ compte correspond \u00e0 celle invit\u00e9e.\n        const link = location.origin + location.pathname + '?join=' + d.membership_id;\n        this.setState({ hhInviteLink: link, hhInvitedEmail: email, hhInviteEmail:'',\n          hhInviteMsgText: this._t('Send this link to ' + email,\n                                   'Envoyez ce lien \u00e0 ' + email,\n                                   'Env\u00eda este enlace a ' + email) });\n      } else {\n        this.setState({ hhInviteMsgText: d.detail || 'Could not invite' });\n      }\n    } catch(e) { console.warn('kerma:hhinvite',e); }\n  };\n  shareInviteLink = async () => {\n    const link = this.state.hhInviteLink; if (!link) return;\n    const msg = this._t('Join our Kerma household: ', 'Rejoignez notre foyer Kerma : ',\n                        '\u00danete a nuestro hogar Kerma: ') + link;\n    try { if (navigator.share) { await navigator.share({ title:'Kerma', text: msg, url: link }); return; } } catch(e) {}\n    try {\n      await navigator.clipboard.writeText(link);\n      this.setState({ hhInviteMsgText: this._t('Link copied', 'Lien copi\u00e9', 'Enlace copiado') });\n    } catch(e) {}\n  };\n  \/\/ Un lien d'invitation ouvert avant connexion doit survivre \u00e0 la cr\u00e9ation\n  \/\/ du compte : on le met de c\u00f4t\u00e9, on le consomme une fois connect\u00e9.\n  _captureJoin = () => {\n    try {\n      const j = new URLSearchParams(location.search).get('join');\n      if (j) { localStorage.setItem('kerma_pending_join', j);\n               history.replaceState({}, '', location.pathname); }\n    } catch(e) {}\n  };\n  _consumeJoin = async () => {\n    let j = null;\n    try { j = localStorage.getItem('kerma_pending_join'); } catch(e) {}\n    if (!j) return;\n    try {\n      const token = await this.getToken(); if (!token) return;\n      const r = await fetch(this._RAILWAY + '\/v1\/household\/respond', {\n        method:'POST', headers:{ 'Content-Type':'application\/json', 'Authorization':'Bearer ' + token },\n        body: JSON.stringify({ membership_id: j, accept: true }) });\n      const d = await r.json().catch(() => ({}));\n      try { localStorage.removeItem('kerma_pending_join'); } catch(e) {}\n      if (r.ok) { this.loadHousehold(); }\n      else { console.warn('[Kerma] join refused:', d.detail); }\n    } catch(e) { console.warn('[Kerma] join failed', e); }\n  };\n  addTypedManual = () => {\n    const v = this.state.krogerQuery.trim(); if (!v) return;\n    this.setState(s => ({ items:[...s.items, this.build(v,1,true)], flow:null, krogerResults:[], krogerQuery:'' }));\n  };\n  quickAdd(name){ this.setState({ typeInput:name }); this.addTyped(); }\n  stockRebuy(name, image){\n    const item = image\n      ? { id:this.nid(), name, qty:1, aisle:'Grocery', emoji:'', tint:'#EFEDE8',\n          options:[{ label:name, brand:'', price:'', store:\"Ralph's\", best:true, image }],\n          chosen:0, image }\n      : this.build(name,1,true);\n    this.setState(s => ({ items:[...s.items, item] }));\n  }\n  pickCategory(term){ this.setState({ typeInput:term }); this.addTyped(); }\n\n  scanReceipt = () => {\n    this.setState({ scanState:'scanning' });\n    clearTimeout(this._st);\n    this._st = setTimeout(() => this.setState({ scanState:'done',\n      detected:['Whole milk','Bananas','Ground coffee','Large eggs','Paper towels','Cheddar cheese'].map(n=>({name:n,qty:1,sel:true})) }), 1700);\n  };\n  setMenu = (e) => this.setState({ menuText: e.target.value });\n  \/\/ dish \u2192 ingredients (name, qty). Astride merges duplicates across meals.\n  RECIPES = {\n    pasta:   [['Penne',1],['Chicken breast',1],['Parmesan',1],['Tomato sauce',1],['Garlic',1]],\n    chicken: [['Chicken breast',1],['Olive oil',1],['Garlic',1]],\n    taco:    [['Ground beef',1],['Tortillas',1],['Cheddar cheese',1],['Tomatoes',1],['Lettuce',1]],\n    salad:   [['Lettuce',1],['Tomatoes',1],['Cucumber',1],['Feta cheese',1],['Olive oil',1]],\n    'stir-fry':[['Bell peppers',1],['Broccoli',1],['Soy sauce',1],['Rice',1],['Garlic',1]],\n    'stir fry':[['Bell peppers',1],['Broccoli',1],['Soy sauce',1],['Rice',1],['Garlic',1]],\n    curry:   [['Chicken breast',1],['Coconut milk',1],['Rice',1],['Onion',1]],\n inach|pasta\/i.test(i.name);\n      return { ...i,\n        sub: o ? o.brand : (unresolved ? 'Tap to choose a type' : i.aisle),\n        subColor: unresolved ? G : '#A6A19A', subWeight: unresolved ? '600' : '500',\n        qtyLabel: '\u00d7'+i.qty, priceText: o ? o.price : (unresolved ? 'Choose' : ''),\n        priceColor: unresolved ? G : (o && o.best ? G : '#111110'),\n        byInitial: byAmir ? 'A' : 'N', byBg: byAmir ? '#D8C9B0' : 'linear-gradient(150deg,#0B7A53,#0E6A49)', byFg: byAmir ? '#6B5A2E' : '#fff',\n        open: () => this.openItem(i.id) };\n    };\n    const runningLow = [], recommended = [];\n    items.forEach(i=>{\n      const k = lowKeyOf(i.name);\n      if (k){\n        const m = LOWMETA[k];\n        const confColor = m.conf>=90 ? '#0B7A53' : (m.conf>=70 ? '#C9912B' : '#C0392B');\n        runningLow.push({ ...mkRow(i), days:m.days, conf:m.conf+'% sure', confColor });\n      } else recommended.push(mkRow(i));\n    });\n    const runningLowCount = runningLow.length, recommendedCount = recommended.length;\n\n    const order = ['Produce','Bakery','Meat','Dairy','Pantry','Household','Other'];\n    const AISLE_NO = { Produce:'Aisle 1', Bakery:'Aisle 3', Meat:'Aisle 5', Dairy:'Aisle 8', Pantry:'Aisle 11', Household:'Aisle 14', Other:'Aisle 16' };\n    const aisles = order.map(name => ({\n      name, no: AISLE_NO[name],\n      items: items.filter(i=>i.aisle===name).map(i => {\n        const done = !!s.checked[i.id];\n        const o = (i.options && i.chosen>=0) ? i.options[i.chosen] : null;\n        return { ...i, toggle:()=>this.toggleCheck(i.id),\n          ring: done?G:'#D6D1C9', fill: done?G:'transparent',\n          color: done?'#A6A19A':'#111110', strike: done?'line-through':'none',\n          brand: o ? (o.label+' \u00b7 '+o.brand) : '',\n          check: done ? this.check12() : '' };\n      })\n    })).filter(a=>a.items.length);\n\n    const doneCount = items.filter(i=>s.checked[i.id]).length;\n    const pct = items.length ? Math.round(doneCount\/items.length*100) : 0;\n    const allDone = doneCount>0 && doneCount===items.length;\n\n    \/\/ add methods (home shortcuts)\n    const M = [\n      {id:'type',  label:'Type',    icon:'\u270f\ufe0f', tint:'#EAF2F8'},\n      {id:'scan',  label:'Receipt', icon:'\ud83e\uddfe', tint:'#EAF5F0'},\n      {id:'scan2', label:'Photo',   icon:'\ud83d\udcf7', tint:'#FBF1D8'},\n      {id:'voice', label:'Voice',   icon:'\ud83c\udf99\ufe0f', tint:'#FCE9E6'},\n      {id:'paste', label:'Paste',   icon:'\ud83d\udccb', tint:'#F1EBF6'},\n      {id:'saved', label:'Saved',   icon:'\u2b50', tint:'#FBF1D8'}\n    ];\n    const methodKey = (id)=> id==='scan2' ? 'scan' : id;\n    const addMethods = M.map(m => ({ ...m, open: () => this.openAdd(methodKey(m.id)) }));\n\n    \/\/ add-sheet tabs\n    const tabsDef = [\n      {id:'type',label:'Type',icon:''},\n      {id:'scan',label:'Receipt',icon:''},\n      {id:'menu',label:'Menu',icon:''},\n      {id:'saved',label:'Saved',icon:''}\n    ];\n    const addTabs = tabsDef.map(t => {\n      const on = s.addMethod === t.id;\n      return { ...t, pick:()=>this.pickMethod(t.id),\n        bg: on?G:'#fff', fg: on?'#fff':'#4A463F',\n        bd: on?G:'rgba(17,17,16,.07)' };\n    });\n\n    const commonRaw = [['Milk','\ud83e\udd5b'],['Eggs','\ud83e\udd5a'],['Bread','\ud83c\udf5e'],['Bananas','\ud83c\udf4c'],['Coffee','\u2615'],['Chicken','\ud83c\udf57'],['Tomatoes','\ud83c\udf45'],['Yogurt','\ud83e\udd63']];\n    const commonItems = commonRaw.map(([name,emoji]) => ({ name, emoji, glyph:this.gl(name), add:()=>this.quickAdd(name) }));\n\n    const savedRaw = [['Whole milk','Clover Organic \u00b7 1 gal','\ud83e\udd5b','#EAF2F8'],['Diapers','Pampers Size 3 \u00b7 168 ct','\ud83e\uddf7','#F1EBF6'],['Coffee',\"Peet's House Blend \u00b7 12 oz\",'\u2615','#FBF1D8'],['Olive oil','California Olive Ranch \u00b7 500ml','\ud83e\uded2','#E7F2E0']];\n    const savedProducts = savedRaw.map(([name,brand,emoji,tint]) => ({ name, brand, emoji, glyph:this.gl(name), tint, add:()=>this.quickAdd(name) }));\n\n    \/\/ detected\n    const detectedView = s.detected.map((d,idx) => {\n      const meta = this.build(d.name,1,true);\n      return { ...d, emoji: meta.emoji, glyph:this.gl(d.name), toggle:()=>this.toggleDetected(idx),\n        ring: d.sel?G:'#D6D1C9', fill: d.sel?G:'transparent', check: d.sel?this.check14():'' };\n    });\n    const showDetected = (s.addMethod==='scan'||s.addMethod==='menu') && s.detected.length>0;\n    const detSel = s.detected.filter(d=>d.sel).length;\n    const allDet = s.detected.length>0 && s.detected.every(d=>d.sel);\n\n    \/\/ active item view\n    let ai = null;\n    const it = items.find(i=>i.id===s.activeId);\n    if (it){\n      const hasOptions = !!it.options;\n      let rangeLabel = it.aisle;\n      let pickReason = '';\n      let options = [];\n      if (hasOptions){\n        const prices = it.options.map(o=>parseFloat(o.price.replace('$','')));\n        const lo = Math.min(...prices).toFixed(2), hi = Math.max(...prices).toFixed(2);\n        rangeLabel = it.options.length+' options \u00b7 $'+lo+'\u2013$'+hi;\n        const bestO = it.options.find(o=>o.best) || it.options[0];\n        pickReason = bestO.label+' from '+bestO.brand.split(' \u00b7 ')[0]+' \u2014 best value at '+bestO.store+' ('+bestO.price+').';\n        options = it.options.map((o,idx) => {\n          const sel = it.chosen===idx;\n          return { ...o,\n            choose:()=>this.chooseOption(idx),\n            border: sel?G:'rgba(17,17,16,.06)',\n            ring: sel?G:'#D6D1C9', dotBg: sel?G:'transparent',\n            dot: sel?this.dot():'',\n            bestTag: o.best ? React.createElement('span',{style:{fontSize:'10px',fontWeight:700,letterSpacing:'.3px',textTransform:'uppercase',color:G,background:'#EAF5F0',padding:'2px 7px',borderRadius:'6px'}},'\u2726 Astride') : '' };\n        });\n      }\n      ai = { ...it, glyph:this.gl(it.name), hasOptions, noOptions:!hasOptions, rangeLabel, pickReason, options,\n        inc:()=>this.itemInc(), dec:()=>this.itemDec(), remove:()=>this.removeActive() };\n    }\n\n    const tripN = s.doneTrips.length;\n    const totalSaved = s.doneTrips.reduce((a,t)=>a+t.amt, 0);\n    const sv = this.savings(totalSaved, tripN);          \/\/ lifetime label (stage-aware)\n    const savedLabel = sv.stat;\n    const isFirstTime = tripN === 0;\n    \/\/ recent trips = REAL completed trips (memo: no fabricated history)\n    const trips = s.doneTrips.slice().reverse().map(t => ({\n      store: t.store, date: t.date, items: t.items, saved: '$'+t.amt.toFixed(2),\n      verified: t.verified===true,\n      tagBg: t.verified ? '#EAF5F0' : '#F0EEE9',\n      tagColor: t.verified ? '#0A5C3F' : '#A6A19A',\n      tagLabel: t.verified ? '\u2713 Verified' : 'Estimated'\n    }));\n    const verifiedCount = s.doneTrips.filter(t=>t.verified).length;\n    \/\/ 6-month chart only meaningful at Stage 2\n    const barData = [['Apr',0],['May',0],['Jun', Math.round(totalSaved)]];\n    const maxV = Math.max(60, ...barData.map(b=>b[1]));\n    const bars = barData.map(([month,v],idx) => ({ month, label:'$'+v, h: Math.round(v\/maxV*116)+'px', bg: idx===barData.length-1 ? 'linear-gradient(180deg,#0E8E5E,#0B7A53)' : '#D7E8DF' }));\n    const VEHICLE_LABELS = { car:'Gas car', ev:'Electric vehicle', transit:'Transit or walk', delivery:'Delivery preferred' };\n    const PRIORITY_LABELS = { price:'Lowest price', time:'My time', organic:'Quality & organic', balance:'Smart balance' };\n    const HOUSEHOLD_LABELS = { 1:'Just me', 2:'Two of us', 4:'A family (3\\u20134)', 6:'Big household (5+)' };\n    const settings = [\n      { title:'Preferences', rows:[\n        {icon:'\ud83d\ude97',tint:'#EAF2F8',label:'Vehicle',value: VEHICLE_LABELS[s.vehicle] || 'Not set'},\n        {icon:'\ud83d\udc65',tint:'#FBF1D8',label:'People',value: HOUSEHOLD_LABELS[s.household] || 'Not set'},\n        {icon:'\ud83d\udccd',tint:'#FCE9E6',label:'Location',value: ((s.hhData && s.hhData.households && s.hhData.households.city) || (this._geo ? 'Located' : '')) || 'Not set'} ]},\n      { title:'Shopping', rows:[\n        {icon:'\u2696\ufe0f',tint:'#F1EBF6',label:'Optimize for',value: PRIORITY_LABELS[s.priority] || 'Not set'} ]}\n    ];\n\n    \/\/ \u2500\u2500 household stock \u2500\u2500\n    const stockInList = (nm)=> items.some(i => i.name.toLowerCase().split(' ')[0] === nm.toLowerCase().split(' ')[0]);\n    const STOCK_META = {\n      milk:{emoji:'\ud83e\udd5b',tint:'#EAF2F8'}, coffee:{emoji:'\u2615',tint:'#FBF1D8'}, eggs:{emoji:'\ud83e\udd5a',tint:'#FBF1D8'},\n      'paper towels':{emoji:'\ud83e\uddfb',tint:'#F1EBF6'}, 'olive oil':{emoji:'\ud83e\uded2',tint:'#E7F2E0'}, pasta:{emoji:'\ud83c\udf5d',tint:'#F0EEE9'},\n      rice:{emoji:'\ud83c\udf5a',tint:'#F0EEE9'}, 'dish soap':{emoji:'\ud83e\uddf4',tint:'#EAF2F8'}, bread:{emoji:'\ud83c\udf5e',tint:'#FBF1D8'},\n      bananas:{emoji:'\ud83c\udf4c',tint:'#FBF1D8'}, butter:{emoji:'\ud83e\uddc8',tint:'#FBF1D8'}, cheese:{emoji:'\ud83e\uddc0',tint:'#FBF1D8'}\n    };\n    const predictions = s.stockPredictions || {};\n    const predEntries = Object.keys(predictions).map(k => predictions[k]).filter(p => p && typeof p.days_left === 'number');\n    const hasStockData = predEntries.length > 0;\n    const stockAll = predEntries.map(p => {\n      const key = (p.name||'').toLowerCase();\n      const meta = STOCK_META[key] || { emoji:'\ud83d\uded2', tint:'#F0EEE9' };\n      const daysLeft = p.days_left;\n      const level = Math.max(0, Math.min(1, daysLeft \/ (p.estimated_cycle_days||30)));\n      const provLabel = p.confidence==='learned' ? 'from your purchases' : 'estimated';\n      return { name: p.name, emoji: meta.emoji, tint: meta.tint,\n        level, low: daysLeft <= 5,\n        days: daysLeft<=0 ? 'now' : ('~'+Math.round(daysLeft)+(Math.round(daysLeft)===1?' day':' days')),\n        provenance: provLabel };\n    });\n    const stockLow = stockAll.filter(x=>x.low).map(x=>{\n      const has = stockInList(x.name);\n      const red = x.level < 0.22;\n      const matched = items.find(i => i.name.toLowerCase().split(' ')[0] === x.name.toLowerCase().split(' ')[0] && i.image);\n      return { ...x, glyph:this.gl(x.name), levelW: Math.round(x.level*100)+'%',\n        image: matched ? matched.image : '', hasImage: !!matched, noImage: !matched,\n        barColor: red?'#E0593B':'#D9912F', daysColor: red?'#C0392B':'#C96A00',\n        showProv: !!x.provenance,\n        add: has ? (()=>{}) : (()=>this.stockRebuy(x.name, matched ? matched.image : '')),\n        btnBg: has?'#EAF5F0':'#0B7A53', btnFg: has?'#0B7A53':'#fff', btnLabel: has?'\u2713 In basket':'Add' };\n    });\n    const stockOk = stockAll.filter(x=>!x.low).map(x=>({ ...x, glyph:this.gl(x.name), levelW: Math.round(x.level*100)+'%' }));\n    \/\/ #12 Pantry timeline \u2014 run-out dates on a 0\u201360 day axis\n    const _PT_MAX = 6;\n    const _ptAll = stockAll.map(x=>{\n      const d = Math.max(0, parseInt((x.days.match(\/\\d+\/)||['0'])[0], 10) || 0);\n      const pct = Math.min(96, Math.max(4, Math.round(d\/60*100)));\n      const c = d<=4 ? '#C0392B' : (d<=10 ? '#C9912B' : '#0B7A53');\n      const isLearned = x.provenance === 'from your purchases';\n      return { emoji:x.emoji, name:x.name, left:pct+'%', marker:pct+'%', color:c,\n        days: x.days,\n        dnum: d,\n        conf: isLearned ? 'From purchases' : 'Estimated', confColor: isLearned?'#0B7A53':'#A6A19A' };\n    });\n    \/\/ La frise ne montre que les plus urgents : au-del\u00e0, la liste devient\n    \/\/ illisible. Le reste reste consultable plus bas (Running low \/ Well stocked).\n    const pantryTimeline = _ptAll.slice(0, _PT_MAX);\n    const _ptHidden = _ptAll.length - pantryTimeline.length;\n    const _ptHiddenMin = _ptHidden > 0 ? Math.min.apply(null, _ptAll.slice(_PT_MAX).map(x=>x.dnum)) : 0;\n    const showPantryMore = _ptHidden > 0;\n    const pantryMoreLabel = _ptHidden > 0\n      ? ('+' + _ptHidden + ' more \u00b7 nothing else due for ' + _ptHiddenMin + '+ days')\n      : '';\n    const lowCount = stockAll.filter(x=>x.low).length;\n    \/\/ \u2500\u2500 panier pr\u00e9c\u00e9dent (vraies dates d'achat) \u2500\u2500\n    const _lb = this._lastBasketItems();\n    const _lbFresh = _lb.fresh;\n    const _dAgo = _lb.ts ? Math.max(0, Math.round((Date.now() - new Date(_lb.ts).getTime())\/86400000)) : 0;\n    const _when = _dAgo <= 1 ? 'Yesterday' : (_dAgo <= 10 ? 'Last week' : (_dAgo + ' days ago'));\n    const _short = (x) => { x = String(x||''); return x.length > 24 ? (x.slice(0,22) + '\\u2026') : x; };\n    const _nm = _lbFresh.slice(0,2).map(p => _short(p.name));\n    const _rest = _lbFresh.length - _nm.length;\n    const showRepeatBasket = hasStockData && _lbFresh.length >= 2;\n    const repeatBasketText = _when + ' you bought ' + _nm.join(', ')\n      + (_rest > 0 ? (' and ' + _rest + ' more') : '') + '. Want the same again?';\n    const repeatBasketCta = 'Add ' + _lbFresh.length + ' items to my list';\n    const _tracked = stockAll.length;\n    const homeScoreNum = (hasStockData && _tracked>0) ? Math.round(100*(_tracked-lowCount)\/_tracked) : null;\n    const homeScoreTitle = !hasStockData ? _say(C.readyTitle, 1) : (lowCount===0 ? 'Home\u2019s in good shape' : (lowCount===1 ? '1 item needs attention' : (lowCount+' items need attention')));\n    const homeScoreSub = !hasStockData ? _say(C.readySub, 1) : (_tracked+' items tracked \u00b7 '+lowCount+' running low');\n    const stockMsg = !hasStockData\n      ? _say(C.stockEmpty, 2)\n      : (lowCount>0 ? (\"You're low on \"+lowCount+\" \"+(lowCount===1?'item':'items')+\" based on your purchases.\") : _say(C.stockGood, 3));\n    const lowPills = stockAll.filter(x=>x.low).slice(0,3).map(x=>({ emoji:x.emoji, label: x.name+' \u00b7 '+((x.days.match(\/\\d+\/)||[''])[0])+'d', go:()=>this.go('stock') }));\n\n    \/\/ \u2500\u2500 seasonal suggestion (proactive Astride) \u2500\u2500\n    \/\/ \u2500\u2500 multi-stop plan (ported from v41) \u2500\u2500\n    \/\/ \u2500\u2500 online cart + in-store extras \u2500\u2500\n    const onlineItems = items.map(i => {\n      const o = (i.options && i.chosen>=0) ? i.options[i.chosen] : null;\n      return { name:i.name, glyph:this.gl(i.name), qty:i.qty,\n        sub: o ? (o.label+' \u00b7 '+o.brand.split(' \u00b7 ')[0]) : (i.options ? 'Choose a type' : i.aisle),\n        price: o ? o.price : '\u2014' };\n    });\n    const tripSavedLabel = '$'+(19.40*pct\/100).toFixed(2);\n\n    \/\/ \u2550\u2550\u2550\u2550\u2550\u2550 DECISION INTELLIGENCE ENGINE \u00b7 true-cost model \u2550\u2550\u2550\u2550\u2550\u2550\n    \/\/ Personalized value of time ($\/min) from onboarding Q4; fuel $\/mile by vehicle.\n    const vt = s.timeValue || 0.33;\n    const veh = s.vehicle || 'car';\n    const fuelMile = veh==='ev' ? 0.06 : (veh==='transit' ? 0 : 0.17);\n    const itemCount = items.length;\n    const extraItems = Math.max(0, itemCount - 6);\n    const weekend = false;        \/\/ demo: weekday\n    const scn = s.scn || {};\n    const transit = !!scn.nocar || veh==='transit';\n\n    \/\/ Per-store inputs. TWO modes the user can browse independently:\n    \/\/  \u2022 in-store (4 stores) \u2014 full time model    \u2022 online (4 services) \u2014 basket + delivery fee\n    \/\/ Real backend data when available (post-Optimize). Falls back to a\n    \/\/ reasonable static default only before the first real Optimize call.\n    const BID_TO_FID = { wm:'walmart', co:'costco', rp:'ralphs', tg:'target-s' };\n    const BID_GLYPH = { wm:'W', co:'C', rp:'R', tg:'T' };\n    const INSTORE_DEF = (s.storeComparison && s.storeComparison.length) ? s.storeComparison.map(st => {\n      \/\/ Time isn't returned granularly by the backend \u2014 split it from the\n      \/\/ real distance using a consistent local-roads estimate, not a\n      \/\/ fabricated number. ~2.2 min\/mile drive, fixed in-store stages.\n      const driveMin = Math.max(3, Math.round(st.total_miles * 2.2));\n      return {\n        id: BID_TO_FID[st.id] || st.id,\n        name: st.name + ' \u00b7 ' + st.city,\n        mode: 'in-store',\n        glyph: BID_GLYPH[st.id] || st.name.charAt(0),\n        basket: st.items,\n        coupons: st.coupons,\n        dist: st.total_miles,\n        drive: driveMin,\n        hoursKnown: !!st.hours_known,\n        openNow: st.open_now,\n        closesIn: (typeof st.closes_in_min === 'number') ? st.closes_in_min : null,\n        nav: Math.max(2, Math.round(driveMin*0.25)),\n        checkout: 8,\n        load: 6\n      };\n    }) : [\n      { id:'walmart', name:'Walmart',  mode:'in-store', glyph:'W', basket:0, coupons:0, dist:0, drive:8,  nav:18, checkout:6,  load:6  },\n      { id:'costco',  name:'Costco',   mode:'in-store', glyph:'C', basket:0, coupons:0, dist:0, drive:19, nav:22, checkout:10, load:12 },\n      { id:'ralphs',  name:\"Ralph's\",  mode:'in-store', glyph:'R', basket:0, coupons:0, dist:0, drive:12, nav:14, checkout:7,  load:4  },\n      { id:'target-s',name:'Target',   mode:'in-store', glyph:'T', basket:0, coupons:0, dist:0, drive:14, nav:13, checkout:5,  load:4  }\n    ];\n    \/\/ Real per-store delivery data when available (post-Optimize). Falls back\n    \/\/ to a neutral default only before the first real online Optimize call.\n    \/\/ We never claim Instacart\/Amazon Fresh integration we don't actually have.\n    const ONLINE_ID_MAP = { wm:'walmartp', rp:'ralphs-o', tg:'target-o' };\n    const ONLINE_GLYPH = { wm:'W', rp:'R', tg:'T' };\n    const ONLINE_ETA = { wm:'45 min', rp:'60 min', tg:'30 min' };\n    const ONLINE_DEF = (s.onlineComparison && s.onlineComparison.length) ? s.onlineComparison.map(st => ({\n      id: ONLINE_ID_MAP[st.id] || st.id,\n      name: st.name + ' \\u00b7 delivery',\n      mode: 'online',\n      glyph: ONLINE_GLYPH[st.id] || st.name.charAt(0),\n      basket: st.items,\n      coupons: st.coupons,\n      deliveryFee: st.delivery,\n      etaTxt: ONLINE_ETA[st.id] || (st.total_minutes + ' min'),\n      note: st.delivery === 0 ? 'free pickup' : ''\n    })) : [\n      { id:'walmartp',name:'Walmart',  mode:'online', glyph:'W', basket:0, coupons:0, deliveryFee:0, etaTxt:'\\u2026', note:'' },\n      { id:'ralphs-o',name:'Ralphs',   mode:'online', glyph:'R', basket:0, coupons:0, deliveryFee:0, etaTxt:'\\u2026', note:'' },\n      { id:'target-o',name:'Target',   mode:'online', glyph:'T', basket:0, coupons:0, deliveryFee:0, etaTxt:'\\u2026', note:'' }\n    ];\n\n    const r2 = (n)=>Math.round(n*100)\/100;\n    const cost = (st)=>{\n      const products = st.basket;\n      const coup = -st.coupons;\n      if (st.mode==='online'){\n        const total = products + coup + st.deliveryFee;\n        return { products, coup, fuel:0, driveT:0, storeT:0, waitT:0, loadT:0, pen:0, fee:st.deliveryFee, total:r2(total) };\n      }\n      const gasMult = scn.gas ? 1.3 : 1;\n      const trafficMult = scn.rush ? 1.5 : 1;\n      const driveMin = st.drive * (transit ? 3 : 1) * trafficMult;          \/\/ one-way\n      const fuel = transit ? 0 : (st.dist * 2 * fuelMile * gasMult);        \/\/ round trip\n      const driveT = driveMin * 2 * vt;                                     \/\/ round trip time\n      const storeT = (st.nav + extraItems*0.5) * vt;\n      const waitMin = st.checkout * (weekend?1.6:1) * (scn.rush?1.4:1);\n      const waitT = waitMin * vt;\n      const loadT = st.load * vt;\n      let pen = 0;\n      if (scn.rain) pen += 8;                       \/\/ weather\n      if (scn.rush) pen += 1.50;                    \/\/ evening fatigue\n      const total = products + coup + fuel + driveT + storeT + waitT + loadT + pen;\n      return { products, coup, fuel:r2(fuel), driveMin:Math.round(driveMin), driveT:r2(driveT), storeMin:st.nav, storeT:r2(storeT), waitMin:Math.round(waitMin), waitT:r2(waitT), loadMin:st.load, loadT:r2(loadT), pen:r2(pen), fee:0, total:r2(total) };\n    };\n    const decorate = (st)=>{ const c=cost(st); return { ...st, c, total:c.total, eta: st.mode==='online' ? st.etaTxt : (c.driveMin+' min '+(transit?'transit':'drive')) }; };\n\n    let scoredInstore;\n    try {\n      \/\/ Un magasin ferm\u00e9 ne doit jamais \u00eatre recommand\u00e9, m\u00eame s'il est le\n      \/\/ moins cher : le trajet serait perdu. Il reste visible, mais en fin\n      \/\/ de liste. Horaires inconnus = trait\u00e9 comme ouvert (on ne devine pas).\n      const _shut = (x) => (x.hoursKnown && x.openNow === false) ? 1 : 0;\n      scoredInstore = INSTORE_DEF.map(decorate)\n        .sort((a,b) => (_shut(a) - _shut(b)) || (a.total - b.total));\n    } catch(e) {\n      if (!window.__kermaAlerted) { window.__kermaAlerted = true; alert('DECORATE CRASH: ' + e.message + ' | INSTORE_DEF: ' + JSON.stringify(INSTORE_DEF).slice(0,300) + ' | storeComparison: ' + JSON.stringify(s.storeComparison).slice(0,300)); }\n      scoredInstore = [];\n    }\n    if (scoredInstore.length < 2) {\n      if (!window.__kermaAlerted2) { window.__kermaAlerted2 = true; alert('scoredInstore too short: ' + scoredInstore.length + ' | storeComparison: ' + JSON.stringify(s.storeComparison).slice(0,400)); }\n      \/\/ Pad defensively so downstream code never reads undefined\n      while (scoredInstore.length < 2) {\n        scoredInstore.push(scoredInstore[0] || { id:'fallback', name:'Nearby store', glyph:'S', total:0, c:{driveT:0,storeT:0,waitT:0,loadT:0,products:0,coup:0,fuel:0}, dist:0 });\n      }\n    }\n    \/\/ IN-STORE ONLY: Astride recommends the best-match physical store by real total cost.\n    const winner = scoredInstore[0];\n    const winnerInStore = true;\n    const otherBest = scoredInstore[1];           \/\/ second-best store, for \"rather go elsewhere\"\n    const runner = scoredInstore[1];\n\n    \/\/ \"Usual\" baseline = unoptimized habit: Ralph's full basket, no coupons, same time model\n    \/\/ \u2500\u2500 R\u00e9f\u00e9rence de comparaison, progressive \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    \/\/ Sans historique : le 2e meilleur choix r\u00e9el \u2014 c'est la vraie marge\n    \/\/ de d\u00e9cision, l'argent que rapporte le fait de suivre Astride.\n    \/\/ D\u00e8s 3 courses : le magasin o\u00f9 l'utilisateur va r\u00e9ellement le plus\n    \/\/ souvent, mesur\u00e9 sur ses courses termin\u00e9es. Jamais le magasin le\n    \/\/ plus cher : ce serait gonfler le chiffre sans \u00e9clairer la d\u00e9cision.\n    const _trips = s.doneTrips || [];\n    const _freq = {};\n    _trips.forEach(tp => {\n      const k = String((tp && tp.store) || '').split(' \u00b7 ')[0].trim();\n      if (k && k !== 'Store') _freq[k] = (_freq[k] || 0) + 1;\n    });\n    let _usualName = '', _usualN = 0;\n    Object.keys(_freq).forEach(k => { if (_freq[k] > _usualN) { _usualN = _freq[k]; _usualName = k; } });\n    const _usualStore = (_trips.length >= 3 && _usualName)\n      ? scoredInstore.find(x => String(x.name || '').split(' \u00b7 ')[0].trim() === _usualName)\n      : null;\n    \/\/ Avertissement de format : fond\u00e9 uniquement sur le nom r\u00e9el du\n    \/\/ magasin retourn\u00e9 par Google. On n'invente aucun inventaire \u2014 on\n    \/\/ signale simplement un fait connu sur ce format de magasin.\n    const showFormatNote = \/neighbou?rhood market\/i.test(String(winner.name || ''));\n    \/\/ Horaires : on ne signale que ce que Google nous a r\u00e9ellement dit.\n    const _anyShut = scoredInstore.some(x => x.hoursKnown && x.openNow === false);\n    const showClosedWarn = _anyShut;\n    const closedWarnText = C.closedWarn;\n    const _wClose = (winner.hoursKnown && winner.openNow && typeof winner.closesIn === 'number')\n      ? winner.closesIn : null;\n    const showClosingSoon = _wClose !== null && _wClose <= 45;\n    const closingSoonText = (_wClose !== null)\n      ? (C.closesIn + _wClose + C.minSuffix + ' \u00b7 ' + Math.round((winner.c && winner.c.driveMin) || 0) + C.minSuffix + ' away')\n      : '';\n    const formatNote = C.formatNote;\n    const _refIsUsual = !!(_usualStore && _usualStore.id !== winner.id);\n    const _ref = _refIsUsual ? _usualStore : runner;\n    const _refName = String((_ref && _ref.name) || '').split(' \u00b7 ')[0];\n    const BASE_USUAL = r2((_ref && _ref.total) || 0);\n    \/\/ Une \u00e9conomie n'est jamais n\u00e9gative : un magasin plus cher que la\n    \/\/ r\u00e9f\u00e9rence rapporte 0, pas un chiffre rouge.\n    const _sv = (total) => r2(Math.max(0, BASE_USUAL - (total || 0)));\n\n    \/\/ \u2500\u2500 Plan du trajet \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    \/\/ Heure d'arriv\u00e9e calcul\u00e9e depuis le temps de trajet r\u00e9el du magasin\n    \/\/ effectivement choisi. Aucune donn\u00e9e trafic n'existe c\u00f4t\u00e9 Kerma :\n    \/\/ on ne pr\u00e9tend donc rien sur le trafic.\n    const _tripName = this._tripStore || '';\n    const _tripObj = scoredInstore.find(x => String(x.name || '') === _tripName) || winner;\n    const _tripDrive = Math.max(0, Math.round((_tripObj && _tripObj.c && _tripObj.c.driveMin) || 0));\n    const _arr = new Date(Date.now() + _tripDrive * 60000);\n    let _ah = _arr.getHours() % 12; if (_ah === 0) _ah = 12;\n    const tripArriveLabel = C.leaveNow + _ah + ':' + String(_arr.getMinutes()).padStart(2, '0')\n      + (_arr.getHours() < 12 ? ' AM' : ' PM');\n    const tripDriveLabel = _tripDrive + C.minDrive + Number((_tripObj && _tripObj.dist) || 0).toFixed(1) + ' mi';\n    const save = _sv(winner.total);\n    const gap  = r2(runner.total - winner.total);\n    const otherSave = _sv(otherBest.total);\n\n    \/\/ winner breakdown lines (calm grouped)\n    const wc = winner.c;\n    const fmt = (n)=> (n<0?'\\u2212$'+Math.abs(n).toFixed(2):'$'+n.toFixed(2));\n    const timeAllIn = winnerInStore ? r2(wc.driveT+wc.storeT+wc.waitT+wc.loadT) : 0;\n    const totalTimeMin = winnerInStore ? (wc.driveMin*2 + wc.storeMin + wc.waitMin + wc.loadMin) : 0;\n    const breakdown = winnerInStore ? [\n      { k:'Products \u00b7 '+itemCount+' items', v: fmt(wc.products) },\n      { k:'Coupons matched',                v: fmt(wc.coup), green:true },\n      { k:'Fuel \u00b7 '+winner.dist+' mi round trip', v: fmt(wc.fuel) },\n      { k:'Your time \u00b7 '+totalTimeMin+' min all-in', v: fmt(timeAllIn) }\n    ] : [\n      { k:'Products \u00b7 '+itemCount+' items', v: fmt(wc.products) },\n      { k:'Coupons matched',                v: fmt(wc.coup), green:true },\n      { k:'Delivery fee',                   v: fmt(wc.fee) }\n    ];\n    if (winner.c.pen>0) breakdown.push({ k: scn.rain?'Weather \u00b7 rain':'Evening trip', v: fmt(winner.c.pen) });\n    const breakdownTotal = '$'+winner.total.toFixed(2);\n\n    \/\/ time detail for \"Why\" (in-store only)\n    const timeDetail = winnerInStore ? [\n      { k:'Drive (round trip)', v: wc.driveMin*2+' min' },\n      { k:'In store',           v: wc.storeMin+' min' },\n      { k:'Checkout wait',      v: wc.waitMin+' min' },\n      { k:'Load \/ unload',      v: wc.loadMin+' min' }\n    ] : [];\n    const vtLabel = '$'+vt.toFixed(2)+'\/min';\n\n    const SCN_DEF = [\n      { id:'nocar',   label:'No car today' },\n      { id:'rush',    label:'Leave at 5 pm' },\n      { id:'gas',     label:'Gas price +30%' },\n      { id:'rain',    label:'Rain forecast' }\n    ];\n    const scnChips = SCN_DEF.map(d=>{\n      const on = !!scn[d.id];\n      return { ...d, on, toggle:()=>this.toggleScn(d.id),\n        bg: on?'#15201B':'#fff', fg: on?'#fff':'#4A463F', bd: on?'#15201B':'rgba(17,17,16,.08)',\n        boxBd: on?'#7DE6B0':'#C9C4BC', boxBg: on?'#0B7A53':'transparent' };\n    });\n\n    const anyScn = Object.keys(scn).length>0;\n    let astrideExplain;\n    if(!anyScn){\n      astrideExplain = winner.name.split(' \u00b7 ')[0] + \" wins on estimated cost \u2014 the lowest basket plus the drive beats every other option nearby today.\";\n    } else if(!winnerInStore){\n      astrideExplain = (scn.nocar ? \"With no car, the value of driving disappears \u2014 \" : \"Conditions shifted, so \")\n        + winner.name.split(' \u00b7 ')[0] + \" delivery is now your cheapest estimated cost at $\" + winner.total.toFixed(2) + \".\";\n    } else {\n      astrideExplain = \"Even with that change, \" + winner.name.split(' \u00b7 ')[0]\n        + \" still comes out ahead \u2014 by $\" + gap.toFixed(2) + \" over the next best option.\";\n    }\n\n    const ASK = [\n      { id:'why',      q:'Why this store?',      a: winner.name.split(' \u00b7 ')[0]+\" had the lowest estimated cost once I added everything up \u2014 basket, coupons, fuel and your time at \"+vtLabel+\". Total \"+breakdownTotal+\".\" },\n      { id:'delivery', q:'Why not just deliver?', a:\"Delivery adds a $9.95 fee and no fuel or driving \u2014 \"+(winnerInStore?(\"but your drive still works out cheaper today. It wins when your time is worth more, or you can't drive.\"):(\"which is exactly why it wins for you right now.\")) },\n      { id:'biggest',  q:'Biggest hidden cost?',  a: winnerInStore? (\"Your time. \"+totalTimeMin+\" minutes all-in at \"+vtLabel+\" = \"+fmt(timeAllIn)+\" \u2014 the biggest line after the groceries. Most apps ignore it; I price it in.\") : (\"The drive. Once I valued your time at \"+vtLabel+\", getting it delivered beat driving anywhere today.\") }\n    ];\n    const askChips = ASK.map(x=>{\n      const on = s.ask===x.id;\n      return { id:x.id, q:x.q, pick:()=>this.setAsk(x.id),\n        bg: on?'#0B7A53':'#fff', fg: on?'#fff':'#4A463F', bd: on?'#0B7A53':'rgba(17,17,16,.08)' };\n    });\n    const askObj = s.ask ? ASK.find(x=>x.id===s.ask) : null;\n\n    \/\/ factor highlight set\n    const hi = new Set();\n    if(scn.nocar){ hi.add('fuel'); hi.add('time'); }\n    if(scn.rush){ hi.add('traffic'); hi.add('time'); }\n    if(scn.gas){ hi.add('fuel'); }\n    if(s.ask==='why'){ hi.add('price'); hi.add('coupons'); }\n    if(s.ask==='delivery'){ hi.add('fuel'); hi.add('time'); }\n    if(s.ask==='biggest'){ hi.add('time'); }\n    \/\/ Real values from the actual winning scenario \u2014 never fabricated.\n    \/\/ Traffic\/weather have no real data source (no live traffic or weather\n    \/\/ API), so they're shown honestly as \"\u2014\" rather than invented states.\n    const _wc = (winner && winner.c) ? winner.c : {};\n    const fuelVal = scn.nocar ? '\u2014' : ('$'+(Number(_wc.fuel)||0).toFixed(2));\n    const timeVal = scn.nocar ? 'bus' : ((_wc.driveMin!=null && !isNaN(_wc.driveMin)) ? (_wc.driveMin+' min') : '\u2014');\n    const trafficVal = '\u2014';\n    const priceVal = '$'+(Number(_wc.products)||0).toFixed(2);\n    const couponsVal = '\u2212$'+Math.abs(Number(_wc.coup)||0).toFixed(2);\n    const NODE_DEF = [\n      { id:'price',   label:'Price',     val:priceVal,  left:'18%', top:'16%' },\n      { id:'coupons', label:'Coupons',   val:couponsVal,left:'82%', top:'16%' },\n      { id:'fuel',    label:'Fuel',      val:fuelVal,   left:'93%', top:'50%' },\n      { id:'time',    label:'Your time', val:timeVal,   left:'78%', top:'86%' },\n      { id:'traffic', label:'Traffic',   val:trafficVal,left:'22%', top:'86%' },\n      { id:'weather', label:'Weather',   val:'\u2014',      left:'7%',  top:'50%' }\n    ];\n    const nodes = NODE_DEF.map(n=>{\n      const on = hi.has(n.id);\n      return { ...n,\n        dotBg: on?'#F0CE84':'#4A5C52',\n        ring: on?'rgba(240,206,132,.22)':'transparent',\n        border: on?'rgba(240,206,132,.5)':'rgba(255,255,255,.12)',\n        valColor: on?'#F0CE84':'rgba(255,255,255,.5)',\n        labelColor: on?'#fff':'rgba(255,255,255,.72)' };\n    });\n\n    \/\/ build comparison rows for a group (ranked, tappable, with honest reason vs that group's best)\n    const buildBars = (group)=>{\n      const basis = s.compareBasis || 'true';\n      const valOf = (x)=> basis==='price' ? r2(x.basket - x.coupons) : x.total;\n      const ranked = group.slice().sort((a,b)=> val
